[project]
name = "poppler"
version = "0.1.0"
description = "Take turns on a single GPU: a lock, a job runner and an MCP server for agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dan Wahl", email = "hi@danwahl.net" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
]

[project.scripts]
poppler = "poppler.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
